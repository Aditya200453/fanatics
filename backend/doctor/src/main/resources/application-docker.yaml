spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DATABASE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # schema comes from init SQL [2](https://insightgloballlc-my.sharepoint.com/personal/pantham_jashwanth_insightglobal_com/Documents/Forms/DispForm.aspx?ID=2271&web=1)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect