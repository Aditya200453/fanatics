server:
  port: ${SERVER_PORT:8076}

spring:
  main:
    web-application-type: reactive

  application:
    name: api-gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:

            # ✅ AUTH
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            # ✅ PATIENT
            - id: patient-service
              uri: lb://patient-service
              predicates:
                - Path=/patient/**

            # ✅ DOCTOR
            - id: doctor-service
              uri: lb://doctor-service
              predicates:
                - Path=/doctor/**

            # ✅ APPOINTMENT
            - id: appointment-service
              uri: lb://appointment-service
              predicates:
                - Path=/appointment/**

            # ✅ SPECIALITY (doctor-service handles it)
            - id: speciality
              uri: lb://doctor-service
              predicates:
                - Path=/speciality/**

            # ✅ DIAGNOSTIC
            - id: diagnostic-service
              uri: lb://diagnostic-service
              predicates:
                - Path=/diagnostic/**

            # ✅ PRESCRIPTION
            - id: prescription-service
              uri: lb://prescription-service
              predicates:
                - Path=/prescription/**

# ✅ Move secrets to env
jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

app:
  internal-key: ${INTERNAL_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
