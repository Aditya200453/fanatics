server:
  port: 8077

spring:
  main:
    web-application-type: reactive

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:   # ✅ REQUIRED FOR SPRING BOOT 3.5+

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: patient-service
              uri: lb://patient
              predicates:
                - Path=/patient/**

            - id: doctor-service
              uri: lb://doctor
              predicates:
                - Path=/doctor/**

            - id: appointment
              uri: lb://appointment
              predicates:
                - Path=/appointment/**

            - id: speciality-api
              uri: lb://doctor
              predicates:
                - Path=/speciality/**

