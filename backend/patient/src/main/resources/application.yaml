spring:
  application:
    # ✅ IMPORTANT: keep consistent naming for Eureka + Gateway routes
    name: patient-service

  profiles:
    # ✅ Docker compose sets SPRING_PROFILES_ACTIVE=docker via .env
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8071}

# ✅ Eureka config shared across profiles
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

# ✅ Internal-key used by gateway/auth for internal validation (no hardcode)
app:
  internal-key: ${INTERNAL_SECRET}

# ✅ Health endpoint (useful for Docker healthchecks)
management:
  endpoints:
    web:
      exposure:
        include: health,info