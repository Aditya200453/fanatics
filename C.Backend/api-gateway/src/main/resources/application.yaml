server:
  port: 8077

spring:
  main:
    web-application-type: reactive

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:   # REQUIRED FOR SPRING BOOT 3.x

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:

            # ================= AUTH =================
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            # ================= PATIENT =================
            - id: patient
              uri: lb://patient
              predicates:
                - Path=/patient/**

            # ================= DOCTOR =================
            - id: doctor
              uri: lb://doctor
              predicates:
                - Path=/doctor/**

            # ================= APPOINTMENT =================
            - id: appointment
              uri: lb://appointment
              predicates:
                - Path=/appointment/**

            # ================= SPECIALITY =================
            # (Speciality APIs are inside doctor service)
            - id: speciality
              uri: lb://doctor
              predicates:
                - Path=/speciality/**

            # ================= DIAGNOSTIC FIX =================
            - id: diagnostic
              uri: lb://diagnostic
              predicates:
                - Path=/diagnostic/**

            - id: prescription-service
              uri: lb://prescription
              predicates:
                - Path=/prescription/**


jwt:
  secret: "MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHg="

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
